    <!-- Error Suppression Script - Must run before any other scripts -->
    <script>
      (function() {
        // Global error handler
        window.onerror = function(msg, url, line, col, error) {
          var message = String(msg);
          if (
            message.includes('beholdReplaceChildren') ||
            message.includes("Cannot read properties of undefined (reading 'beholdReplaceChildren')") ||
            (error && error.message && error.message.includes('beholdReplaceChildren')) ||
            (error && error.stack && error.stack.includes('beholdReplaceChildren'))
          ) {
            return true; // Suppress error
          }
          return false;
        };

        // Unhandled rejection handler
        window.addEventListener('unhandledrejection', function(event) {
          var message = event.reason ? (event.reason.message || String(event.reason)) : '';
          if (
            message.includes('beholdReplaceChildren') ||
            message.includes("Cannot read properties of undefined (reading 'beholdReplaceChildren')")
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        // Console error override
        var originalConsoleError = console.error;
        console.error = function() {
          var args = Array.from(arguments);
          var message = args.map(function(arg) {
            return (arg instanceof Error) ? (arg.message + (arg.stack || '')) : String(arg);
          }).join(' ');

          if (
            message.includes('beholdReplaceChildren') ||
            message.includes("Cannot read properties of undefined (reading 'beholdReplaceChildren')")
          ) {
            return;
          }
          originalConsoleError.apply(console, args);
        };
      })();
    </script>
