# =============================================================================
# Netlify Configuration for Ash Shaw Makeup Portfolio
# =============================================================================
# This file configures the Netlify deployment and build settings
# Documentation: https://docs.netlify.com/configure-builds/file-based-configuration/
# =============================================================================

[build]
  # Build command - uses Vite to build the React app
  command = "npm run build"

  # Directory containing the built static files
  publish = "dist"

  # Functions directory (for serverless functions if needed)
  functions = "netlify/functions"

# Production environment variables
[build.environment]
  NODE_VERSION = "24"
  NPM_VERSION = "10"
  # Contentful environment (default is master)
  VITE_CONTENTFUL_ENVIRONMENT = "master"

# =============================================================================
# HEADERS - Security and Performance
# =============================================================================

# Default security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively (immutable for hashed files)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts with long TTL
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images with reasonable TTL
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# =============================================================================
# REDIRECTS - SPA Fallback and Custom Routes
# =============================================================================

# API proxy for Contentful webhook handler (if using Netlify Functions)
[[redirects]]
  from = "/api/contentful-webhook"
  to = "/.netlify/functions/contentful-webhook"
  status = 200

# SPA fallback - serve index.html for all routes (client-side routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# =============================================================================
# BUILD PROCESSING - Optimization
# =============================================================================

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# =============================================================================
# CONTEXT-SPECIFIC SETTINGS
# =============================================================================

# Preview deployments (for PR previews)
[context.deploy-preview]
  command = "npm run build"
  [context.deploy-preview.environment]
    # Use preview token for draft content in preview deployments
    VITE_CONTENTFUL_USE_PREVIEW = "true"

# Branch deploys (staging, development branches)
[context.branch-deploy]
  command = "npm run build"
  [context.branch-deploy.environment]
    VITE_CONTENTFUL_USE_PREVIEW = "true"

# Production context
[context.production]
  command = "npm run build"
  [context.production.environment]
    VITE_CONTENTFUL_USE_PREVIEW = "false"

# =============================================================================
# DEV SERVER (for netlify dev command)
# =============================================================================

[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 3000
  autoLaunch = false
